name: CI

on:
  push:
    branches: [main]
  pull_request:

# Deterministic checks only. Nothing here reaches an external network host
# other than the package registry — live-source tests are scheduled
# separately so an external outage can't make ordinary PRs flaky
# (OVERVIEW.md section 12).
jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hoosradar
          POSTGRES_PASSWORD: hoosradar_dev
          POSTGRES_DB: hoosradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hoosradar -d hoosradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://hoosradar:hoosradar_dev@localhost:5432/hoosradar
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Proves the deployable artifact still builds. Not pushed anywhere —
      # deployment is Milestone 4 (ADR 0003).
      - name: Build image
        run: docker build -t hoosradar:ci .
